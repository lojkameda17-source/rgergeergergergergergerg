version: "3.9"
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lead:lead@db:5432/leaddb
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lead
      POSTGRES_PASSWORD: lead
      POSTGRES_DB: leaddb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
